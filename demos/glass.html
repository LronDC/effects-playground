<main>
<header><a class="wordmark" href="./">Fold <i>Glass</i><span>INTERACTION STUDY</span></a><button id="uploadButton" class="text-button">换成我的照片 ↗</button><input id="imageInput" type="file" accept="image/*" hidden></header>
<section id="stage" tabindex="0" aria-label="左右拖动，观察照片穿过玻璃时的折射变化">

<section class="controller" aria-label="动效控制">

<div class="options"><div class="segmented" aria-label="对照模式"><button data-mode="handoff" aria-pressed="true">折射 + 对焦</button><button data-mode="refraction" aria-pressed="false">只看折射</button><button data-mode="blur" aria-pressed="false">只有模糊</button></div><label class="grid-toggle"><input id="gridToggle" type="checkbox"> 换成网格检查</label></div>
</section><footer><span>实时 WebGL · 拖到哪，就停在哪</span><span>独立视觉实验，非 Apple 官方实现</span></footer>
</main><script>/* Original screen-space refraction study. No Apple code or private API. */
(() => {

      float picture = u_imageSize.x / u_imageSize.y;

        vec2 pixel = uv * u_resolution;

      gradient = vec2(rotation[0].x*gradient.x+rotation[0].y*gradient.y,rotation[1].x*gradient.x+rotation[1].y*gradient.y);

      vec2 lip = ray.xy/max(.1,-ray.z)*(.025+.05*lift+.022*profile)/vec2(1.,aspect);
      float corner = smoothstep(.12,.45,abs(gradient.x*gradient.y));

      vec3 color = source(bentUV)*.24;
      color += source(bentUV + stepUV*vec2(1.6,0.))*.12;
      color += source(bentUV - stepUV*vec2(1.6,0.))*.12;
      color += source(bentUV + stepUV*vec2(0.,1.))*.10;
      color += source(bentUV - stepUV*vec2(0.,1.))*.10;
      color += source(bentUV + stepUV*vec2(1.2,.8))*.08;
      color += source(bentUV + stepUV*vec2(-1.2,.8))*.08;
      color += source(bentUV + stepUV*vec2(1.2,-.8))*.08;

  function frame(now){
    if(state.auto&&state.ready){
      const duration=2400*Math.abs((direction===1?1:0)-playFrom)/state.speed;
      const elapsed=now-playStart,t=clamp(elapsed/Math.max(duration,1));
